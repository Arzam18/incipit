
name: Android Development Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "engine/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android-arm64:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Install Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Configure Android linker
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"

          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "Android NDK path not found."
            env | grep -E 'ANDROID.*NDK' || true
            exit 1
          fi

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [ ! -x "$TOOLCHAIN/aarch64-linux-android24-clang" ]; then
            echo "Android ARM64 NDK compiler not found:"
            ls -la "$TOOLCHAIN" | head -50
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Download and verify NNUE network
        working-directory: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y make curl
          make net
          test -s "$(basename "$(cat net.txt)")"
          echo "NNUE network ready."

      - name: Build Android ARM64 binary
        working-directory: engine
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail

          NET="$(pwd)/$(basename "$(cat net.txt)")"

          export CC_aarch64_linux_android
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
          export EVALFILE="$NET"

          # Baseline ARM64; do not assume optional CPU instructions.
          export RUSTFLAGS="-C target-cpu=generic"

          cargo build \
            --release \
            --target aarch64-linux-android

          mkdir -p ../dist
          cp target/aarch64-linux-android/release/incipit \
            ../dist/incipit-android-arm64

          file ../dist/incipit-android-arm64
          ls -lh ../dist/incipit-android-arm64

      - name: Upload Android development binary
        uses: actions/upload-artifact@v4
        with:
          name: incipit-android-arm64
          path: dist/incipit-android-arm64
          if-no-files-found: error
          retention-days: 30
