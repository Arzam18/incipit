
      - name: Build Incipit for Android ARM64
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail

          NET="$PWD/$(basename "$(cat net.txt)")"
          test -s "$NET"

          cargo clean

          export CC="$ANDROID_CC"
          export AR="$ANDROID_AR"
          export EVALFILE="$NET"

          # Configure Cargo's Android target linker explicitly.
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$ANDROID_CC"
          EOF

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_CC"
          export RUSTFLAGS="-C target-cpu=generic"

          echo "Android compiler: $CC"
          echo "Android archiver: $AR"
          echo "Android linker: $CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          echo "NNUE network: $EVALFILE"

          cargo build \
            --release \
            --target aarch64-linux-android \
            -vv

          BINARY="target/aarch64-linux-android/release/incipit"
          test -s "$BINARY"

          mkdir -p ../dist
          cp "$BINARY" ../dist/incipit-android-arm64

          file ../dist/incipit-android-arm64
          ls -lh ../dist/incipit-android-arm64
