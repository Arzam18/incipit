
name: Android Development Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "engine/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android-arm64:
    name: Incipit Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Install Rust target
        run: |
          rustup target add aarch64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;27.3.13750724"

      - name: Configure Android compiler
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="$SDK/ndk/27.3.13750724"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"

          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

          echo "Android NDK: $NDK"
          "$TOOLCHAIN/aarch64-linux-android24-clang" --version

      - name: Download NNUE network
        working-directory: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make net
          test -s "$(basename "$(cat net.txt)")"

      - name: Compile Incipit for Android
        working-directory: engine
        run: |
          set -euo pipefail

          NET="$PWD/$(basename "$(cat net.txt)")"

          CC_aarch64_linux_android="$CC_aarch64_linux_android" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER" \
          EVALFILE="$NET" \
          RUSTFLAGS="-C target-cpu=generic" \
            cargo build --release --target aarch64-linux-android

          mkdir -p ../dist
          cp target/aarch64-linux-android/release/incipit \
            ../dist/incipit-android-arm64

          file ../dist/incipit-android-arm64
          ls -lh ../dist/incipit-android-arm64

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: incipit-android-arm64
          path: dist/incipit-android-arm64
          if-no-files-found: error
          retention-days: 30
