
name: Android Development Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "engine/**"
      - "third_party/fathom/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android-arm64:
    name: Incipit Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;27.3.13750724"

      - name: Configure Android ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="$SDK/ndk/27.3.13750724"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="$BIN/aarch64-linux-android24-clang"
          AR="$BIN/llvm-ar"

          test -x "$CC"
          test -x "$AR"

          echo "ANDROID_CC=$CC" >> "$GITHUB_ENV"
          echo "ANDROID_AR=$AR" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC" >> "$GITHUB_ENV"

          echo "Android compiler:"
          "$CC" --version

          echo "Android archiver:"
          "$AR" --version

      - name: Download NNUE network
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y make curl

          make net

          test -s net.txt
          NET_NAME="$(basename "$(cat net.txt)")"
          test -s "$NET_NAME"

          echo "NNUE network: $NET_NAME"
          ls -lh "$NET_NAME"

      - name: Build Incipit for Android ARM64
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail

          NET="$PWD/$(basename "$(cat net.txt)")"
          test -s "$NET"

          # Remove stale host-compiled objects and libraries.
          cargo clean

          # Native C compilation and archiving for Fathom.
          export CC="$ANDROID_CC"
          export AR="$ANDROID_AR"
          export EVALFILE="$NET"

          # Configure the target-specific Cargo linker.
          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$ANDROID_CC"
          EOF

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_CC"
          export RUSTFLAGS="-C target-cpu=generic"

          echo "Target: aarch64-linux-android"
          echo "C compiler: $CC"
          echo "Archiver: $AR"
          echo "Linker: $CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          echo "NNUE: $EVALFILE"

          cargo build \
            --release \
            --target aarch64-linux-android \
            -vv

          BINARY="target/aarch64-linux-android/release/incipit"
          test -s "$BINARY"

          mkdir -p ../dist
          cp "$BINARY" ../dist/incipit-android-arm64

          file ../dist/incipit-android-arm64
          ls -lh ../dist/incipit-android-arm64

      - name: Upload Android development binary
        uses: actions/upload-artifact@v4
        with:
          name: incipit-android-arm64
          path: dist/incipit-android-arm64
          if-no-files-found: error
          retention-days: 30
